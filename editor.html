<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Website Editor — Himanshu Chandelkar</title><link rel="stylesheet" href="editor.css"></head>
<body>
<header><div><b>HC.</b><span> Website Editor</span></div><div class="top-actions"><button id="saveBtn">Save</button><button id="exportBtn" class="primary">Download content.json</button><a href="index.html" target="_blank">View site ↗</a></div></header>
<div class="layout">
<aside><div class="side-title">EDIT</div><button class="tab active" data-tab="hero">🏠 Hero</button><button class="tab" data-tab="about">👤 About</button><button class="tab" data-tab="education">🎓 Education</button><button class="tab" data-tab="interests">♡ Interests</button><button class="tab" data-tab="socials">🔗 Socials</button><button class="tab" data-tab="design">⚙ Design</button><div class="hint">Changes are saved in this browser. Download <b>content.json</b> when you're ready to publish.</div></aside>
<section class="workspace"><div id="panel"></div></section>
<aside class="preview"><div class="preview-head"><span>LIVE PREVIEW</span><button id="resetBtn">Reset</button></div><iframe id="previewFrame"></iframe></aside>
</div>
<script src="editor.js"></script></body></html>
